theme: jekyll-theme-chirpy

lang: ko-KR

timezone: Asia/Seoul

title: redskelt's Blog

tagline: My Personal Articles

description: >-
  redskelt's personal blog and articles.

url: "https://redskelt.github.io"

github:
  username: redskelt

social:
  name: redskelt
  email:
  links:
    - https://github.com/redskelt

theme_mode:

avatar: /assets/img/avatar.jpg

toc: true

comments:
  provider: giscus
  giscus:
    repo: redskelt/redskelt.github.io
    repo_id: MDEwOlJlcG9zaXRvcnk5NDQyNzE0NQ==
    category: Announcements
    category_id: DIC_kwDOBaDYCc4DDn9v

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
