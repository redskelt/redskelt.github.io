# 로컬 vendored _layouts/_includes/_sass가 우선 적용된다.
# Jekyll은 remote_theme의 _data를 읽지 않으므로, 필요한 _data 파일은 직접 vendor한다.
remote_theme              : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default"

locale                   : "ko-KR"
title                    : "redskelt's Blog"
title_separator          : "-"
subtitle                  : "redskelt's personal blog and articles."
name                      : "redskelt"
description               : "redskelt's personal blog and articles."
url                       : "https://redskelt.github.io"
baseurl                   :
repository                : "redskelt/redskelt.github.io"
teaser                    :
logo                      :
masthead_title            :
words_per_minute          : 200

comments:
  provider               : "giscus"
  giscus:
    repo                 : "redskelt/redskelt.github.io"
    repo_id              : "MDEwOlJlcG9zaXRvcnk5NDQyNzE0NQ=="
    category_name         : "Announcements"
    category_id           : "DIC_kwDOBaDYCc4DDn9v"
    theme                 : "dark"

search                   : true
search_full_content      : false
search_provider          : "lunr"
lunr:
  search_within_pages    : true

analytics:
  provider               : false

author:
  name             : "redskelt"
  avatar           : "/assets/img/avatar.jpg"
  bio              : "redskelt's personal blog and articles."
  location         :
  email            :
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/redskelt"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/redskelt"

include:
  - .htaccess
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - wiki
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Gemfile
  - node_modules
  - package.json
  - package-lock.json
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

sass:
  sass_dir: _sass
  style: compressed
  cache: false

permalink: /:categories/:title/
paginate: 12
paginate_path: /page:num/
timezone: Asia/Seoul

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true

dark_theme_toggle        : true
after_footer_scripts:
  - /assets/js/custom/theme-toggle.js
  - /assets/js/custom/copy-code.js
  - /assets/js/custom/toc-toggle.js
  - /assets/js/custom/sidebar-toggle.js
  - /assets/js/custom/archive-filter.js
  - /assets/js/custom/doc-chip-color.js
  - /assets/js/custom/toc-scrollspy.js
  - /assets/js/custom/search-overlay.js
  - /assets/js/custom/docs-deeplink.js
  - /assets/js/custom/nav-integrity-guard.js
